# strongSwan configuration of the site B gateway (59.62.1.2, LAN 192.168.2.0/24)
# See site-a/swanctl.conf for the line-by-line explanation.

connections {

  # Tunnel B <-> A (site A initiates it, we answer)
  b-a {
    version = 2
    local_addrs  = 59.62.1.2
    remote_addrs = 62.59.1.2
    proposals = aes256gcm16-prfsha256-x25519
    dpd_delay = 10s

    local {
      auth = psk
      id = site-b
    }
    remote {
      auth = psk
      id = site-a
    }
    children {
      lan {
        local_ts  = 192.168.2.0/24
        remote_ts = 192.168.1.0/24
        esp_proposals = aes256gcm16-x25519
        start_action = trap                       # responder: the tunnel is ready, and it opens
        dpd_action = trap                         # on the first matching packet if needed
      }
    }
  }

  # Tunnel B <-> C (we initiate it)
  b-c {
    version = 2
    local_addrs  = 59.62.1.2
    remote_addrs = 80.59.62.2
    proposals = aes256gcm16-prfsha256-x25519
    dpd_delay = 10s

    local {
      auth = psk
      id = site-b
    }
    remote {
      auth = psk
      id = site-c
    }
    children {
      lan {
        local_ts  = 192.168.2.0/24
        remote_ts = 192.168.3.0/24
        esp_proposals = aes256gcm16-x25519
        start_action = start
        dpd_action = restart
      }
    }
  }
}

secrets {
  include secrets.conf
}
