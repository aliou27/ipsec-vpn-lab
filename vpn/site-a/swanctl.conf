# strongSwan configuration of the site A gateway (62.59.1.2, LAN 192.168.1.0/24)
#
# Cisco equivalent, for reference:
#   crypto isakmp policy 10       ->  proposals
#   crypto isakmp key ... address ->  secrets (generated at startup, see lab/vpn-up.sh)
#   crypto ipsec transform-set    ->  esp_proposals
#   access-list (crypto ACL)      ->  local_ts / remote_ts
#   crypto map ... set peer       ->  remote_addrs

connections {

  # Tunnel A <-> B
  a-b {
    version = 2                                   # IKEv2
    local_addrs  = 62.59.1.2
    remote_addrs = 59.62.1.2
    proposals = aes256gcm16-prfsha256-x25519      # IKE SA: AES-256-GCM, SHA-256 PRF, Curve25519
    dpd_delay = 10s                               # Dead Peer Detection: check the peer every 10 s

    local {
      auth = psk
      id = site-a
    }
    remote {
      auth = psk
      id = site-b
    }
    children {
      lan {
        local_ts  = 192.168.1.0/24                # traffic from my LAN...
        remote_ts = 192.168.2.0/24                # ...to site B's LAN goes in the tunnel
        esp_proposals = aes256gcm16-x25519        # ESP: AES-256-GCM, new DH on each rekey (PFS)
        start_action = start                      # site A opens this tunnel at startup
        dpd_action = restart                      # and reopens it if the peer disappears
      }
    }
  }

  # Tunnel A <-> C
  a-c {
    version = 2
    local_addrs  = 62.59.1.2
    remote_addrs = 80.59.62.2
    proposals = aes256gcm16-prfsha256-x25519
    dpd_delay = 10s

    local {
      auth = psk
      id = site-a
    }
    remote {
      auth = psk
      id = site-c
    }
    children {
      lan {
        local_ts  = 192.168.1.0/24
        remote_ts = 192.168.3.0/24
        esp_proposals = aes256gcm16-x25519
        start_action = start
        dpd_action = restart
      }
    }
  }
}

secrets {
  include secrets.conf
}
