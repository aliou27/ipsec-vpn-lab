# strongSwan configuration of the site A gateway (62.59.1.2, LAN 192.168.1.0/24)
#
# Cisco equivalent, for reference:
#   crypto isakmp policy 10       ->  proposals
#   crypto isakmp key ... address ->  secrets (generated at startup, see lab/vpn-up.sh)
#   crypto ipsec transform-set    ->  esp_proposals
#   access-list (crypto ACL)      ->  local_ts / remote_ts (traffic selectors)
#   crypto map ... set peer       ->  remote_addrs
#
# Only HTTP, HTTPS and ping may use the tunnels (IPSL exercise 1). Each tunnel
# therefore carries three CHILD_SAs, each with its own traffic selectors:
#
#   web-out  my clients  -> their web servers   me:1024-65535  -> peer:80,443
#   web-in   their clients -> my web servers    me:80,443      <- peer:1024-65535
#   ping     ICMP both ways
#
# A selector describes BOTH directions of a flow: "me:1024-65535 -> peer:80"
# also covers the replies "peer:80 -> me:1024-65535". The Cisco version of this
# lab forgot the replies (the ACLs only matched "dst port 80"), so HTTP never
# went through its tunnels. Clients use ephemeral ports (1024-65535) and
# servers use 80/443, which makes web-out and web-in impossible to confuse.
#
# Anything else between the sites matches no selector and is dropped by the
# firewall (vpn/firewall.nft) instead of leaking in clear on the WAN.

connections {

  # Tunnel A <-> B (we open it)
  a-b {
    version = 2                                   # IKEv2
    local_addrs  = 62.59.1.2
    remote_addrs = 59.62.1.2
    proposals = aes256gcm16-prfsha256-x25519      # IKE SA: AES-256-GCM, SHA-256 PRF, Curve25519
    dpd_delay = 10s                               # Dead Peer Detection: check the peer every 10 s

    local {
      auth = psk
      id = site-a
    }
    remote {
      auth = psk
      id = site-b
    }
    children {
      web-out {
        local_ts  = 192.168.1.0/24[tcp/1024-65535]
        remote_ts = 192.168.2.0/24[tcp/80], 192.168.2.0/24[tcp/443]
        esp_proposals = aes256gcm16-x25519        # ESP: AES-256-GCM, new DH on each rekey (PFS)
        start_action = start
        dpd_action = restart
      }
      web-in {
        local_ts  = 192.168.1.0/24[tcp/80], 192.168.1.0/24[tcp/443]
        remote_ts = 192.168.2.0/24[tcp/1024-65535]
        esp_proposals = aes256gcm16-x25519
        start_action = start
        dpd_action = restart
      }
      ping {
        local_ts  = 192.168.1.0/24[icmp]
        remote_ts = 192.168.2.0/24[icmp]
        esp_proposals = aes256gcm16-x25519
        start_action = start
        dpd_action = restart
      }
    }
  }

  # Tunnel A <-> C (we open it)
  a-c {
    version = 2
    local_addrs  = 62.59.1.2
    remote_addrs = 80.59.62.2
    proposals = aes256gcm16-prfsha256-x25519
    dpd_delay = 10s

    local {
      auth = psk
      id = site-a
    }
    remote {
      auth = psk
      id = site-c
    }
    children {
      web-out {
        local_ts  = 192.168.1.0/24[tcp/1024-65535]
        remote_ts = 192.168.3.0/24[tcp/80], 192.168.3.0/24[tcp/443]
        esp_proposals = aes256gcm16-x25519
        start_action = start
        dpd_action = restart
      }
      web-in {
        local_ts  = 192.168.1.0/24[tcp/80], 192.168.1.0/24[tcp/443]
        remote_ts = 192.168.3.0/24[tcp/1024-65535]
        esp_proposals = aes256gcm16-x25519
        start_action = start
        dpd_action = restart
      }
      ping {
        local_ts  = 192.168.1.0/24[icmp]
        remote_ts = 192.168.3.0/24[icmp]
        esp_proposals = aes256gcm16-x25519
        start_action = start
        dpd_action = restart
      }
    }
  }
}

secrets {
  include secrets.conf
}
