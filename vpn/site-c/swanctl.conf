# strongSwan configuration of the site C gateway (80.59.62.2, LAN 192.168.3.0/24)
# See site-a/swanctl.conf for the line-by-line explanation.

connections {

  # Tunnel C <-> A (site A opens it, we answer)
  c-a {
    version = 2
    local_addrs  = 80.59.62.2
    remote_addrs = 62.59.1.2
    proposals = aes256gcm16-prfsha256-x25519
    dpd_delay = 10s

    local {
      auth = psk
      id = site-c
    }
    remote {
      auth = psk
      id = site-a
    }
    children {
      web-out {
        local_ts  = 192.168.3.0/24[tcp/1024-65535]
        remote_ts = 192.168.1.0/24[tcp/80], 192.168.1.0/24[tcp/443]
        esp_proposals = aes256gcm16-x25519
        start_action = trap
        dpd_action = trap
      }
      web-in {
        local_ts  = 192.168.3.0/24[tcp/80], 192.168.3.0/24[tcp/443]
        remote_ts = 192.168.1.0/24[tcp/1024-65535]
        esp_proposals = aes256gcm16-x25519
        start_action = trap
        dpd_action = trap
      }
      ping {
        local_ts  = 192.168.3.0/24[icmp]
        remote_ts = 192.168.1.0/24[icmp]
        esp_proposals = aes256gcm16-x25519
        start_action = trap
        dpd_action = trap
      }
    }
  }

  # Tunnel C <-> B (site B opens it, we answer)
  c-b {
    version = 2
    local_addrs  = 80.59.62.2
    remote_addrs = 59.62.1.2
    proposals = aes256gcm16-prfsha256-x25519
    dpd_delay = 10s

    local {
      auth = psk
      id = site-c
    }
    remote {
      auth = psk
      id = site-b
    }
    children {
      web-out {
        local_ts  = 192.168.3.0/24[tcp/1024-65535]
        remote_ts = 192.168.2.0/24[tcp/80], 192.168.2.0/24[tcp/443]
        esp_proposals = aes256gcm16-x25519
        start_action = trap
        dpd_action = trap
      }
      web-in {
        local_ts  = 192.168.3.0/24[tcp/80], 192.168.3.0/24[tcp/443]
        remote_ts = 192.168.2.0/24[tcp/1024-65535]
        esp_proposals = aes256gcm16-x25519
        start_action = trap
        dpd_action = trap
      }
      ping {
        local_ts  = 192.168.3.0/24[icmp]
        remote_ts = 192.168.2.0/24[icmp]
        esp_proposals = aes256gcm16-x25519
        start_action = trap
        dpd_action = trap
      }
    }
  }
}

secrets {
  include secrets.conf
}
